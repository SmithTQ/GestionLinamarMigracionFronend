<header class="sticky top-0 z-10 flex h-20 items-center justify-between border-b border-base-200 bg-base-100 px-6">
  <div class="flex items-center gap-4">
    <app-button variant="ghost" size="sm" (clicked)="toggleSidebar.emit()">Menu</app-button>
    <div>
      <p class="text-sm font-semibold text-neutral">Panel operativo</p>
      <p class="text-xs text-neutral/60">Campana Madre 2026</p>
    </div>
  </div>
  <div class="flex flex-wrap items-center gap-3">
    <label class="input input-bordered hidden items-center gap-2 md:flex">
      <input type="text" class="grow" placeholder="Buscar pedido o ruta" />
      <span class="text-xs text-neutral/50">CTRL + K</span>
    </label>
    <app-button variant="ghost" size="sm">Notificaciones</app-button>
    <div class="flex items-center gap-2 rounded-full bg-base-200 px-3 py-2">
      <div class="h-8 w-8 rounded-full bg-primary text-xs font-semibold text-white">MT</div>
      <div class="hidden text-xs md:block">
        <p class="font-semibold text-neutral">Maria Torres</p>
        <p class="text-neutral/60">Operaciones</p>
      </div>
    </div>
  </div>
</header>
