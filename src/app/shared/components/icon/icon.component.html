<svg
  [attr.width]="size"
  [attr.height]="size"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  [attr.stroke-width]="strokeWidth"
  stroke-linecap="round"
  stroke-linejoin="round"
  [ngClass]="className"
  aria-hidden="true"
>
  @for (path of iconPaths; track path) {
    <path [attr.d]="path"></path>
  }
</svg>
