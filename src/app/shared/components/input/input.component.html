<label class="form-control w-full">
  @if (label) {
    <span class="label-text text-sm font-medium text-neutral">{{ label }}</span>
  }
  <input
    class="input input-bordered w-full"
    [class.input-sm]="size === 'sm'"
    [ngClass]="inputClass"
    [type]="type"
    [placeholder]="placeholder"
    [value]="value"
    [disabled]="disabled"
    [attr.id]="id || null"
    (input)="onInput(($any($event.target).value || '').toString())"
  />
  @if (helper && !error) {
    <span class="label-text-alt text-xs text-neutral/60">{{ helper }}</span>
  }
  @if (error) {
    <span class="label-text-alt text-xs text-error">{{ error }}</span>
  }
</label>
