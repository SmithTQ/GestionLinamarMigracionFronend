@if (isOpen) {
  <div class="modal modal-open">
    <div
      class="modal-box modal-shell relative max-h-[90vh] overflow-y-auto"
      [ngClass]="{
        'max-w-md': size === 'sm',
        'max-w-2xl': size === 'md',
        'max-w-4xl': size === 'lg',
        'max-w-6xl': size === 'xl',
        'w-11/12': size === 'full',
        'max-w-none': size === 'full',
      }"
    >
      <button
        type="button"
        aria-label="Cerrar modal"
        class="btn btn-sm btn-circle btn-ghost absolute right-4 top-4 z-20 bg-base-100/90 shadow-sm"
        [disabled]="closeDisabled"
        (click)="close()"
      >
        X
      </button>
      <ng-content></ng-content>
    </div>
    <button
      type="button"
      class="modal-backdrop"
      aria-label="Cerrar modal"
      [disabled]="closeDisabled"
      (click)="close()"
    ></button>
  </div>
}
