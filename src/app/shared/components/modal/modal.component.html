<div class="modal modal-open" *ngIf="isOpen">
  <div
    class="modal-box"
    [ngClass]="{
      'max-w-md': size === 'sm',
      'max-w-2xl': size === 'md',
      'max-w-4xl': size === 'lg',
      'max-w-6xl': size === 'xl',
      'w-11/12': size === 'full',
      'max-w-none': size === 'full'
    }"
  >
    <button class="btn btn-sm btn-circle btn-ghost absolute right-4 top-4" (click)="close()">
      X
    </button>
    <ng-content></ng-content>
  </div>
  <div class="modal-backdrop" (click)="close()"></div>
</div>
