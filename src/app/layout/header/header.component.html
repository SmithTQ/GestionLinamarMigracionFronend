<header
  class="sticky top-0 z-10 flex h-20 items-center justify-between border-b border-base-200 bg-base-100 px-6"
>
  <div class="flex items-center gap-4">
    <app-button variant="ghost" size="sm" icon="menu" (clicked)="toggleSidebar.emit()">
    </app-button>
    <div>
      <p class="text-sm font-semibold text-neutral">Panel operativo</p>
      <p class="text-xs text-neutral/60">Campana Madre 2026</p>
    </div>
  </div>
  <div class="flex flex-wrap items-center gap-3">
    <label class="input input-bordered hidden items-center gap-2 md:flex">
      <app-icon name="search" [size]="16" className="text-neutral/60"></app-icon>
      <input
        type="text"
        class="grow bg-transparent focus:bg-transparent"
        placeholder="Buscar pedido o ruta"
      />
      <span class="text-xs text-neutral/50">CTRL + K</span>
    </label>
    <app-button
      variant="ghost"
      size="sm"
      [icon]="isDark() ? 'sun' : 'moon'"
      [iconOnly]="true"
      [ariaLabel]="isDark() ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'"
      (clicked)="toggleTheme()"
    ></app-button>
    <app-button variant="ghost" size="sm" icon="bell"></app-button>
    <div class="dropdown dropdown-end">
      <div
        tabindex="0"
        class="flex cursor-pointer items-center gap-2 rounded-full bg-base-200 px-3 py-2"
      >
        <div
          class="flex h-8 w-8 items-center justify-center rounded-full bg-primary text-xs font-semibold text-white"
        >
          <app-icon name="circle-user" [size]="16" className="text-white"></app-icon>
        </div>
        <div class="hidden text-xs md:block">
          <p class="font-semibold text-neutral">{{ userName() }}</p>
          <p class="text-neutral/60">{{ userRole() }}</p>
        </div>
      </div>
      <ul
        tabindex="0"
        class="menu dropdown-content z-[1] w-44 rounded-box bg-base-100 p-2 text-sm shadow"
      >
        <li>
          <button
            type="button"
            class="flex w-full items-center gap-2"
            [disabled]="isLoggingOut()"
            [attr.aria-busy]="isLoggingOut()"
            (click)="logout()"
          >
            @if (isLoggingOut()) {
              <span class="loading loading-spinner loading-xs" aria-hidden="true"></span>
              <span>Cerrando sesion...</span>
            } @else {
              <span>Cerrar sesion</span>
            }
          </button>
        </li>
      </ul>
    </div>
  </div>
</header>
