<div class="min-h-screen bg-base-200">
  <div class="flex">
    <div
      class="fixed inset-0 z-30 bg-neutral/40 transition-opacity duration-200 lg:hidden"
      [ngClass]="{
        'opacity-100': !isSidebarCollapsed(),
        'pointer-events-none opacity-0': isSidebarCollapsed()
      }"
      (click)="setSidebarState(true)"
    ></div>
    <div
      class="fixed inset-y-0 left-0 z-40 w-64 transform transition-transform duration-200 lg:hidden"
      [ngClass]="{
        'translate-x-0': !isSidebarCollapsed(),
        '-translate-x-full': isSidebarCollapsed()
      }"
    >
      <app-sidebar
        [collapsed]="false"
        (collapsedChange)="setSidebarState($event)"
      ></app-sidebar>
    </div>
    <div class="hidden lg:flex">
      <app-sidebar
        [collapsed]="isSidebarCollapsed()"
        (collapsedChange)="setSidebarState($event)"
      ></app-sidebar>
    </div>
    <div class="flex min-h-screen flex-1 flex-col">
      <app-header (toggleSidebar)="toggleSidebar()"></app-header>
      <main class="flex-1">
        <router-outlet></router-outlet>
      </main>
      <app-footer></app-footer>
    </div>
  </div>
</div>
