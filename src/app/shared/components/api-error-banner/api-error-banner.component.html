@if (message(); as currentMessage) {
  <div
    class="fixed inset-x-4 top-4 z-[100] flex items-start gap-3 rounded-xl border border-error/30 bg-base-100 p-4 text-error shadow-xl sm:left-auto sm:max-w-md"
    role="alert"
    aria-live="assertive"
  >
    <p class="flex-1 text-sm font-medium">{{ currentMessage }}</p>
    <button
      type="button"
      class="btn btn-ghost btn-xs text-error"
      aria-label="Cerrar mensaje"
      (click)="close()"
    >
      Cerrar
    </button>
  </div>
}
